<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morning handover</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="journal-tokens.css">
<link rel="stylesheet" href="ds/journal/components/bundle.css">
<script src="ds/journal/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--paper)}
</style>
</helmet>
<div style="background: var(--paper); color: var(--ink); font-family: var(--font-sans); padding: 24px 48px 64px; box-sizing: border-box;">
  <div style="max-width: 1120px; margin: 0 auto;">

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 48px;">
      <span style="font-family: var(--font-serif); font-size: 17px; line-height: 24px; font-weight: 600;">Daily Journal</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <x-import component-from-global-scope="Journal.Button" kbd="⌘K">Search</x-import>
        <x-import component-from-global-scope="Journal.Button" kbd="R">Look back</x-import>
      </div>
    </div>

    <x-import component-from-global-scope="Journal.DayHeader" date="2026-10-23" is-today="{{yes}}"></x-import>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 12px;">
      <x-import component-from-global-scope="Journal.ProgressMeter" done="{{zero}}" total="{{total}}"></x-import>
      <span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">3 carried from Thursday</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 48px; margin-top: 32px; align-items: flex-start;">

      <section style="flex: 1.4 1 420px; min-width: 0;">
        <h2 style="margin: 0 0 8px; font-family: var(--font-serif); font-size: 20px; line-height: 28px; font-weight: 600;">Carried in</h2>
        <ul class="dj-list">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
            <li class="dj-task {{r.rowClass}}" style="{{r.focusStyle}}">
              <span class="dj-check" aria-hidden="true"></span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
                <span class="dj-task-text">{{r.before}} <sc-if value="{{r.hasTicket}}" hint-placeholder-val="{{true}}"><span class="dj-ticket">{{r.ticket}}</span></sc-if> {{r.after}}</span>
                <span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">{{r.note}}</span>
                <sc-if value="{{r.focused}}" hint-placeholder-val="{{false}}">
                  <span style="display: inline-flex; flex-wrap: wrap; gap: 16px; margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--ink-muted);">
                    <span style="display: inline-flex; align-items: center; gap: 8px;"><kbd class="dj-kbd">X</kbd> Done</span>
                    <span style="display: inline-flex; align-items: center; gap: 8px;"><kbd class="dj-kbd">D</kbd> Drop</span>
                    <span style="display: inline-flex; align-items: center; gap: 8px;"><kbd class="dj-kbd">↓</kbd> Next</span>
                  </span>
                </sc-if>
              </div>
              <span class="dj-task-meta"><span class="dj-carry"><span aria-hidden="true">↻</span> {{r.days}}d</span></span>
            </li>
          </sc-for>
        </ul>

        <h2 style="margin: 32px 0 8px; font-family: var(--font-serif); font-size: 20px; line-height: 28px; font-weight: 600;">New today</h2>
        <x-import component-from-global-scope="Journal.TaskInput" auto-focus="{{no}}"></x-import>
      </section>

      <div style="flex: 1 1 340px; min-width: 0;">
        <x-import component-from-global-scope="Journal.CommentSheet" mode="read" title="Thursday's notes" value="{{comment}}" meta="read only"></x-import>
      </div>

    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 13px; line-height: 18px; color: var(--ink-muted);">
      <span style="display: inline-flex; align-items: center; gap: 8px;"><kbd class="dj-kbd">N</kbd> Skip to new tasks</span>
      <span style="display: inline-flex; align-items: center; gap: 8px;"><kbd class="dj-kbd">C</kbd> Comments</span>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const focusStyle = 'outline: 2px solid var(--accent); outline-offset: 2px;';
    const rows = [
      { before: 'Review', ticket: 'SAAM-2161', after: 'prompt-eval PR', days: 7, note: 'No note since Fri 16 Oct', rowClass: 'dj-task-stuck', focused: true, focusStyle },
      { before: 'Reply to Minh about', ticket: 'SAAM-2134', after: 'retry logic', days: 3, note: 'Thu: waiting for Minh to confirm before I change anything', rowClass: '', focused: false, focusStyle: '' },
      { before: 'Ask Linh for staging access', ticket: '', after: '', days: 1, note: 'Thu: can I get read access to staging before Friday?', rowClass: '', focused: false, focusStyle: '' }
    ];
    return {
      yes: true,
      no: false,
      zero: 0,
      total: rows.length,
      rows: rows.map((r) => ({ ...r, hasTicket: r.ticket !== '' })),
      comment: 'Checked the logs for SAAM-2134: the timeout comes from the upstream call, not our retry. Waiting for Minh to confirm before I change anything.\n\nQuestion for Linh: can I get read access to staging before Friday? Needed for the SAAM-2188 rollout check.\n\nRollout note is at https://wiki.example.com/rollout/saam-2188, review welcome.'
    };
  }
}
</script>
</body>
</html>
